<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64">
  <!-- Donut icon lockup on the left, filling height (centred in a 64x64 box) -->
  <g transform="translate(2 2) scale(0.1171875)">
    <!-- 0.1171875 = 60/512 : scales the 512 icon down to 60px, leaving 2px margin -->
    <rect width="512" height="512" rx="96" fill="#1c1c1c"/>
    <g fill="none" stroke-width="68" transform="rotate(-90 256 256)">
      <circle cx="256" cy="256" r="144" stroke="#03a9f4" stroke-dasharray="398 506.78"/>
      <circle cx="256" cy="256" r="144" stroke="#ffa726" stroke-dasharray="225 679.78" stroke-dashoffset="-398"/>
      <circle cx="256" cy="256" r="144" stroke="#66bb6a" stroke-dasharray="157 747.78" stroke-dashoffset="-623"/>
      <circle cx="256" cy="256" r="144" stroke="#546e7a" stroke-dasharray="120 784.78" stroke-dashoffset="-780"/>
    </g>
    <circle cx="256" cy="256" r="80" fill="#1c1c1c"/>
    <g stroke="#eceff1" stroke-linecap="round">
      <line x1="256" y1="256" x2="256" y2="184" stroke-width="16"/>
      <line x1="256" y1="256" x2="304" y2="284" stroke-width="14"/>
    </g>
    <circle cx="256" cy="256" r="18" fill="#eceff1"/>
  </g>
  <!-- Stacked wordmark to the right, matching EA's two-line layout.
       Dark text on transparent so it reads on light HACS/GitHub backgrounds (like EA). -->
  <text x="72" y="27" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#37474f">Entity State</text>
  <text x="72" y="48" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#03a9f4">Tracker</text>
</svg>
