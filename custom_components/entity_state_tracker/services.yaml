reset_ledger:
  name: Reset ledger
  description: Clear the persisted daily-bucket history for Entity State Tracker. Long time frames rebuild from recorder data where still available. This cannot be undone.
  fields:
    confirm:
      name: Confirm
      description: Must be enabled to carry out the reset. Guards against accidental history loss.
      required: true
      default: false
      selector:
        boolean:
    entity_id:
      name: Tracked entity
      description: Limit the reset to the tracker(s) watching this tracked entity. Leave empty to reset every Entity State Tracker. This is the entity a tracker watches, not the tracker's own sensor.
      required: false
      selector:
        entity:
          multiple: true
